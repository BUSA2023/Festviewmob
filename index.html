    <main class="p-4 relative z-10 max-w-lg mx-auto" id="appContent">

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 p-2 pb-safe flex justify-around items-center z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">

    <canvas id="certCanvas" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // UPDATED TO NEW PRIMARY DATABASE (fest-66fe3)
        const firebaseConfig = {
            apiKey: "AIzaSyDy4XPx_UwsoLzh3PTCgfsccZxz5Oc80n8",
            authDomain: "fest-66fe3.firebaseapp.com",
            projectId: "fest-66fe3",
            storageBucket: "fest-66fe3.firebasestorage.app",
            messagingSenderId: "1044450457376",
            appId: "1:1044450457376:web:94c5aa76b0bf7a2fc20945",
            measurementId: "G-47FEMSFRCH"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const festId = 'urava-s4-fest';

        // Read QR Code URL parameter (?c=J101 or ?chest=J101)
        const urlParams = new URLSearchParams(window.location.search);
        const qrCandParam = urlParams.get('c') || urlParams.get('chest') || '';

        let state = { 
            programs: [], 
            candidates: [], 
            results: [], 
            tab: qrCandParam ? 'search' : 'home', 
            searchQuery: qrCandParam 
        };
        let initialLoad = true;

        window.showAppToast = (header, msg, icon="✨") => {
            const toast = document.getElementById('liveToast');
            document.getElementById('toastHeader').innerHTML = `<span>${icon}</span> ${header}`;
            document.getElementById('toastMsg').innerText = msg;
            toast.style.display = 'flex'; 
            toast.classList.remove('toast-slide');
            void toast.offsetWidth; // trigger reflow
            toast.classList.add('toast-slide');
            setTimeout(()=> { toast.style.display = 'none'; }, 5000);
        };

        window.switchTab = (tab) => { state.tab = tab; renderApp(); window.scrollTo(0,0); };
        
        window.updateSearch = (val) => { 
            state.searchQuery = val; 
            renderApp(); 
            const s = document.getElementById('searchInp'); 
            if(s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } 
        };

        const attachPortalListeners = () => {
            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'settings'), (snap) => {
                snap.docs.forEach(d => { if(d.id === 'config') state.programs = d.data().programs || []; }); 
                renderApp();
            }, (err) => console.warn("Settings sync notice:", err));

            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'candidates'), (snap) => {
                state.candidates = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
                renderApp();
            }, (err) => console.warn("Candidates sync notice:", err));

            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'results'), (snap) => {
                state.results = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> b.timestamp - a.timestamp); 
                renderApp();
                
                if(!initialLoad) {
                    snap.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const prog = state.programs.find(p => p.id === change.doc.data().progId);
                            if(prog) window.showAppToast("New Result Published!", prog.name, "🏆");
                        }
                    });
                }
                setTimeout(() => { initialLoad = false; }, 2000);
            }, (err) => console.warn("Results sync notice:", err));
        };

        signInAnonymously(auth).catch(() => {
            // Fallback if anonymous auth isn't enabled in Firebase console yet
            attachPortalListeners();
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                attachPortalListeners();
            }
        });

        // Professional Certificate Generator using Canvas
        window.downloadCertificate = (candName, candTeam, candCat, progName, positionStr) => {
            window.showAppToast("Generating Certificate", "Please wait a moment...", "⏳");
            
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set A4 Dimensions (150 DPI to prevent mobile memory crashes)
            canvas.width = 1240; 
            canvas.height = 1754;

            const logo = new Image();
            logo.crossOrigin = "Anonymous";
            logo.src = "https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261011_193849.png";
            
            logo.onload = () => {
                // 1. Draw Background
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. Draw Decorative Premium Borders
                ctx.lineWidth = 20;
                ctx.strokeStyle = '#1e3a8a'; // Deep Blue
                ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);
                
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#d4af37'; // Gold
                ctx.strokeRect(80, 80, canvas.width - 160, canvas.height - 160);
                ctx.strokeRect(92, 92, canvas.width - 184, canvas.height - 184);

                // 3. Draw Logo
                ctx.drawImage(logo, canvas.width / 2 - 200, 150, 400, 400);

                // 4. Header Texts
                ctx.textAlign = 'center';
                
                ctx.fillStyle = '#1e3a8a';
                ctx.font = '900 55px "Cinzel"';
                ctx.fillText('AAWAAZE FUNOON SEASON 04', canvas.width / 2, 600, canvas.width - 240);

                ctx.fillStyle = '#d4af37'; // Gold
                ctx.font = 'bold 30px "Cinzel"';
                ctx.letterSpacing = "8px";
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', canvas.width / 2, 680, canvas.width - 240);
                ctx.letterSpacing = "0px";

                // 5. Content Text
                ctx.fillStyle = '#475569';
                ctx.font = 'italic 35px "Playfair Display"';
                ctx.fillText('This certificate is proudly presented to', canvas.width / 2, 820);

                // Candidate Name
                ctx.fillStyle = '#0f172a';
                ctx.font = '900 90px "Outfit"';
                const maxNameWidth = canvas.width - 260;
                ctx.fillText(candName, canvas.width / 2, 950, maxNameWidth);
                
                // Name Underline
                let nameMetrics = ctx.measureText(candName);
                let underlineWidth = Math.min(nameMetrics.width + 60, maxNameWidth);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 - (underlineWidth / 2), 990);
                ctx.lineTo(canvas.width / 2 + (underlineWidth / 2), 990);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#d4af37';
                ctx.stroke();

                // Details
                ctx.fillStyle = '#475569';
                ctx.font = '30px "Playfair Display"';
                ctx.fillText(`representing team ${candTeam} (${candCat})`, canvas.width / 2, 1070, canvas.width - 240);
                ctx.fillText('for securing', canvas.width / 2, 1140);

                // Position
                ctx.fillStyle = '#1e3a8a'; 
                ctx.font = 'bold 55px "Cinzel"';
                ctx.fillText(positionStr.toUpperCase(), canvas.width / 2, 1230, canvas.width - 240);

                ctx.fillStyle = '#475569';
                ctx.font = 'italic 30px "Playfair Display"';
                ctx.fillText('in the event', canvas.width / 2, 1310);

                // Program Name
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 45px "Cinzel"';
                ctx.fillText(progName, canvas.width / 2, 1390, canvas.width - 240);

                // 6. Signatures area
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 22px "Cinzel"';
                
                ctx.beginPath(); ctx.moveTo(250, 1600); ctx.lineTo(500, 1600); ctx.stroke();
                ctx.fillText('FEST COORDINATOR', 375, 1640);
                
                ctx.beginPath(); ctx.moveTo(canvas.width - 500, 1600); ctx.lineTo(canvas.width - 250, 1600); ctx.stroke();
                ctx.fillText('PRINCIPAL', canvas.width - 375, 1640);

                // Trigger Download
                const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `Certificate_${candName}_${progName}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                window.showAppToast('Success!', 'Certificate downloaded to your device.', '✅');
            };

            logo.onerror = () => {
                window.showAppToast('Error', 'Could not load certificate assets. Check internet.', '❌');
            };
        };

        window.renderApp = () => {
            ['home', 'results', 'search', 'gallery'].forEach(t => {
                const el = document.getElementById('nav-' + t);
                if(el) el.className = `flex flex-col items-center p-2 w-16 transition-colors ${state.tab === t ? 'nav-active' : 'nav-inactive'}`;
            });

            const content = document.getElementById('appContent');
            let stats = { 'Al-Masūdi': 0, 'Al-Qazwini': 0 };
            let detailedStats = {
                'Junior': { 'Stage': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 }, 'Non-Stage': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 }, 'Total': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 } },
                'Senior': { 'Stage': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 }, 'Non-Stage': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 }, 'Total': { 'Al-Masūdi': 0, 'Al-Qazwini': 0 } }
            };
            let candTotalPts = {};
            
            state.results.forEach(res => {
                const prog = state.programs.find(p => p.id === res.progId);
                if(!prog) return;
                
                let ptsArr = (prog.pointScheme || (prog.format === 'Group' ? "15,8,5" : "10,5,3")).split(',').map(Number);
                const pCat = prog.cat === 'Senior' ? 'Senior' : 'Junior';
                const pType = prog.type === 'Non-Stage' ? 'Non-Stage' : 'Stage';

                const addPts = (ids, pts) => {
                    (Array.isArray(ids)?ids:[]).forEach(id => {
                        const c = state.candidates.find(x => x.id === id);
                        if(c) {
                            if(stats[c.team] !== undefined) {
                                stats[c.team] += pts;
                                if(detailedStats[pCat] && detailedStats[pCat][pType][c.team] !== undefined) {
                                    detailedStats[pCat][pType][c.team] += pts;
                                    detailedStats[pCat]['Total'][c.team] += pts;
                                }
                            }
                            candTotalPts[c.id] = (candTotalPts[c.id] || 0) + pts;
                        }
                    });
                };
                addPts(res.first, ptsArr[0]); addPts(res.second, ptsArr[1]); addPts(res.third, ptsArr[2]);
            });

            if (state.tab === 'home') {
                const masudiTotal = stats['Al-Masūdi'];
                const qazwiniTotal = stats['Al-Qazwini'];
                const pointDiff = Math.abs(masudiTotal - qazwiniTotal);
                let leaderText = 'Tie - Both Teams Equal';
                let leaderBadgeClass = 'bg-slate-800 text-slate-300 border-slate-700';
                if (masudiTotal > qazwiniTotal) {
                    leaderText = `Al-Masūdi leads by ${pointDiff} PTS`;
                    leaderBadgeClass = 'bg-sky-500/15 text-sky-300 border-sky-500/40';
                } else if (qazwiniTotal > masudiTotal) {
                    leaderText = `Al-Qazwini leads by ${pointDiff} PTS`;
                    leaderBadgeClass = 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40';
                }

                const jrDiff = Math.abs(detailedStats['Junior']['Total']['Al-Masūdi'] - detailedStats['Junior']['Total']['Al-Qazwini']);
                const srDiff = Math.abs(detailedStats['Senior']['Total']['Al-Masūdi'] - detailedStats['Senior']['Total']['Al-Qazwini']);

                content.innerHTML = `
                    <div class="fade-in bg-slate-900/60 border border-slate-800 rounded-3xl p-5 text-center mb-5 shadow-xl relative overflow-hidden backdrop-blur-md">
                        <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%205-01.png" class="absolute -right-10 -bottom-10 h-40 opacity-20 object-contain pointer-events-none">
                        <h2 class="text-white font-black text-2xl mb-0.5 tracking-tight">Live Leaderboard</h2>
                        <p class="text-[10px] text-sky-400 font-bold uppercase tracking-widest mb-4">Aawaaze Funoon S4 • ${state.results.length} Results</p>
                        
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-t-2 border-sky-400 p-4 rounded-2xl text-center shadow-lg relative overflow-hidden">
                                <h3 class="text-sky-400 font-black text-xs tracking-widest uppercase mb-1">Al-Masūdi</h3>
                                <div class="text-4xl font-black text-white num-font relative z-10">${masudiTotal}</div>
                            </div>
                            <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-t-2 border-emerald-400 p-4 rounded-2xl text-center shadow-lg relative overflow-hidden">
                                <h3 class="text-emerald-400 font-black text-xs tracking-widest uppercase mb-1">Al-Qazwini</h3>
                                <div class="text-4xl font-black text-white num-font relative z-10">${qazwiniTotal}</div>
                            </div>
                        </div>

                        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border text-xs font-extrabold tracking-wide ${leaderBadgeClass}">
                            <span>⚡</span>
                            <span>${leaderText}</span>
                        </div>
                    </div>

                    <!-- Detailed Category & Stage/Non-Stage Point Table -->
                    <div class="fade-in bg-slate-900/80 border border-slate-800 rounded-3xl p-4 mb-5 shadow-xl backdrop-blur-md">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <h3 class="text-white font-black text-sm uppercase tracking-wider flex items-center gap-1.5">
                                <span>📋</span> Category Point Table
                            </h3>
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Stage & Non-Stage</span>
                        </div>

                        <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-950/70">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-900 border-b border-slate-800 text-[10px] font-black uppercase tracking-wider">
                                        <th class="py-3 px-3 text-slate-400">Category</th>
                                        <th class="py-3 px-2 text-center text-sky-400">Al-Masūdi</th>
                                        <th class="py-3 px-2 text-center text-emerald-400">Al-Qazwini</th>
                                        <th class="py-3 px-2 text-center text-amber-400">Diff</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/70 text-xs">
                                    <!-- Junior Stage -->
                                    <tr class="hover:bg-slate-900/40">
                                        <td class="py-2.5 px-3 font-bold text-slate-200 flex items-center gap-1.5">
                                            <span class="w-2 h-2 rounded-full bg-sky-400"></span> Junior Stage
                                        </td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-sky-300">${detailedStats['Junior']['Stage']['Al-Masūdi']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-emerald-300">${detailedStats['Junior']['Stage']['Al-Qazwini']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-xs text-slate-400">${Math.abs(detailedStats['Junior']['Stage']['Al-Masūdi'] - detailedStats['Junior']['Stage']['Al-Qazwini'])}</td>
                                    </tr>
                                    <!-- Junior Non-Stage -->
                                    <tr class="hover:bg-slate-900/40">
                                        <td class="py-2.5 px-3 font-bold text-slate-200 flex items-center gap-1.5">
                                            <span class="w-2 h-2 rounded-full bg-indigo-400"></span> Junior Non-Stage
                                        </td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-sky-300">${detailedStats['Junior']['Non-Stage']['Al-Masūdi']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-emerald-300">${detailedStats['Junior']['Non-Stage']['Al-Qazwini']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-xs text-slate-400">${Math.abs(detailedStats['Junior']['Non-Stage']['Al-Masūdi'] - detailedStats['Junior']['Non-Stage']['Al-Qazwini'])}</td>
                                    </tr>
                                    <!-- Junior Sub-Total -->
                                    <tr class="bg-slate-900/70 font-black">
                                        <td class="py-2 px-3 text-[10px] uppercase tracking-wider text-sky-400">Junior Total</td>
                                        <td class="py-2 px-2 text-center num-font text-sm text-white">${detailedStats['Junior']['Total']['Al-Masūdi']}</td>
                                        <td class="py-2 px-2 text-center num-font text-sm text-white">${detailedStats['Junior']['Total']['Al-Qazwini']}</td>
                                        <td class="py-2 px-2 text-center num-font text-xs text-amber-400">${jrDiff}</td>
                                    </tr>

                                    <!-- Senior Stage -->
                                    <tr class="hover:bg-slate-900/40">
                                        <td class="py-2.5 px-3 font-bold text-slate-200 flex items-center gap-1.5">
                                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Senior Stage
                                        </td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-sky-300">${detailedStats['Senior']['Stage']['Al-Masūdi']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-emerald-300">${detailedStats['Senior']['Stage']['Al-Qazwini']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-xs text-slate-400">${Math.abs(detailedStats['Senior']['Stage']['Al-Masūdi'] - detailedStats['Senior']['Stage']['Al-Qazwini'])}</td>
                                    </tr>
                                    <!-- Senior Non-Stage -->
                                    <tr class="hover:bg-slate-900/40">
                                        <td class="py-2.5 px-3 font-bold text-slate-200 flex items-center gap-1.5">
                                            <span class="w-2 h-2 rounded-full bg-teal-400"></span> Senior Non-Stage
                                        </td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-sky-300">${detailedStats['Senior']['Non-Stage']['Al-Masūdi']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-sm text-emerald-300">${detailedStats['Senior']['Non-Stage']['Al-Qazwini']}</td>
                                        <td class="py-2.5 px-2 text-center font-bold num-font text-xs text-slate-400">${Math.abs(detailedStats['Senior']['Non-Stage']['Al-Masūdi'] - detailedStats['Senior']['Non-Stage']['Al-Qazwini'])}</td>
                                    </tr>
                                    <!-- Senior Sub-Total -->
                                    <tr class="bg-slate-900/70 font-black">
                                        <td class="py-2 px-3 text-[10px] uppercase tracking-wider text-emerald-400">Senior Total</td>
                                        <td class="py-2 px-2 text-center num-font text-sm text-white">${detailedStats['Senior']['Total']['Al-Masūdi']}</td>
                                        <td class="py-2 px-2 text-center num-font text-sm text-white">${detailedStats['Senior']['Total']['Al-Qazwini']}</td>
                                        <td class="py-2 px-2 text-center num-font text-xs text-amber-400">${srDiff}</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border-t-2 border-slate-700 font-black">
                                        <td class="py-3 px-3 text-xs uppercase tracking-wider text-white">Grand Total</td>
                                        <td class="py-3 px-2 text-center num-font text-lg text-sky-400">${masudiTotal}</td>
                                        <td class="py-3 px-2 text-center num-font text-lg text-emerald-400">${qazwiniTotal}</td>
                                        <td class="py-3 px-2 text-center num-font text-base text-amber-400">${pointDiff}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <!-- Under-Table Summary: Each Team Points & Point Difference -->
                        <div class="grid grid-cols-3 gap-2.5 mt-3 pt-3 border-t border-slate-800/80 text-center">
                            <div class="bg-sky-950/30 border border-sky-500/30 rounded-xl p-2.5">
                                <div class="text-[9px] font-black uppercase text-sky-400 tracking-wider">Al-Masūdi</div>
                                <div class="text-xl font-black text-white num-font mt-0.5">${masudiTotal} <span class="text-[9px] font-bold text-slate-400">PTS</span></div>
                            </div>
                            <div class="bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-2.5">
                                <div class="text-[9px] font-black uppercase text-emerald-400 tracking-wider">Al-Qazwini</div>
                                <div class="text-xl font-black text-white num-font mt-0.5">${qazwiniTotal} <span class="text-[9px] font-bold text-slate-400">PTS</span></div>
                            </div>
                            <div class="bg-amber-950/30 border border-amber-500/30 rounded-xl p-2.5">
                                <div class="text-[9px] font-black uppercase text-amber-400 tracking-wider">Difference</div>

                            </div>

                            </div>
                        </div>
                    </div>
                `;
            }

            if (state.tab === 'results') {
                let html = `<div class="fade-in flex justify-between items-center mb-6"><h2 class="text-white font-black text-2xl tracking-tight">Latest Results</h2><span class="bg-sky-500/20 text-sky-400 text-[10px] px-3 py-1 rounded-full font-bold border border-sky-500/30 uppercase tracking-widest">${state.results.length} Pub</span></div><div class="space-y-4 fade-in">`;
                
                if(state.results.length === 0) html += `<div class="text-center bg-slate-900/50 p-10 rounded-3xl border border-slate-800 text-slate-500 text-sm mt-10">No results published yet. Check back soon!</div>`;
                
                const getNameHtml = (ids) => {
                    let arr = Array.isArray(ids) ? ids : [];
                    if(arr.length === 0) return '<div class="text-white/50 italic text-sm">-</div>';
                    return arr.map(id => {
                        const c = state.candidates.find(x => x.id === id);
                        return c ? `<div class="font-bold text-white text-sm leading-tight flex justify-between items-end">${c.name} <span class="text-[9px] font-bold text-black/60 bg-white/30 px-1.5 py-0.5 rounded uppercase tracking-wider shadow-sm">#${c.regNo}</span></div>` : '';
                    }).join('<div class="h-px w-full bg-white/10 my-2"></div>');
                };

                state.results.forEach(res => {
                    const prog = state.programs.find(p => p.id === res.progId); if(!prog) return;
                    html += `
                    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/80 p-5 rounded-3xl relative shadow-lg overflow-hidden">
                        <div class="mb-4">
                            <h4 class="font-black text-white text-lg leading-tight mb-1">${prog.progNo ? `<span class="text-sky-400 font-mono">#${prog.progNo}</span> ` : ''}${prog.name}</h4>
                            <div class="inline-block bg-slate-950 px-2.5 py-1 rounded text-[9px] font-bold text-slate-400 uppercase tracking-widest border border-slate-800 shadow-inner">${prog.cat} • ${prog.type}</div>
                        </div>
                        <div class="space-y-3">
                            <div class="bg-gradient-to-r from-yellow-600/90 to-yellow-500/80 border border-yellow-400/50 p-3 rounded-2xl flex gap-3 shadow-md relative overflow-hidden">
                                <div class="absolute right-0 top-0 bottom-0 w-20 bg-gradient-to-l from-yellow-300/20 to-transparent pointer-events-none"></div>
                                <div class="text-2xl drop-shadow-md bg-white/20 h-10 w-10 rounded-xl flex items-center justify-center border border-white/30 shrink-0">🥇</div><div class="flex-1 self-center z-10">${getNameHtml(res.first)}</div>
                            </div>
                            <div class="bg-gradient-to-r from-slate-600/90 to-slate-500/80 border border-slate-400/50 p-3 rounded-2xl flex gap-3 shadow-md relative overflow-hidden">
                                <div class="absolute right-0 top-0 bottom-0 w-20 bg-gradient-to-l from-white/10 to-transparent pointer-events-none"></div>
                                <div class="text-2xl drop-shadow-md bg-white/20 h-10 w-10 rounded-xl flex items-center justify-center border border-white/30 shrink-0">🥈</div><div class="flex-1 self-center z-10">${getNameHtml(res.second)}</div>
                            </div>
                            <div class="bg-gradient-to-r from-amber-700/90 to-amber-600/80 border border-amber-500/50 p-3 rounded-2xl flex gap-3 shadow-md relative overflow-hidden">
                                <div class="absolute right-0 top-0 bottom-0 w-20 bg-gradient-to-l from-amber-300/20 to-transparent pointer-events-none"></div>
                                <div class="text-2xl drop-shadow-md bg-white/20 h-10 w-10 rounded-xl flex items-center justify-center border border-white/30 shrink-0">🥉</div><div class="flex-1 self-center z-10">${getNameHtml(res.third)}</div>
                            </div>
                        </div>
                    </div>`;
                });
                content.innerHTML = html + `</div>`;
            }

            if (state.tab === 'search') {
                let html = `
                    <div class="fade-in">
                        <h2 class="text-white font-black text-2xl mb-4 tracking-tight">Candidate Profile</h2>
                        <div class="relative mb-6">
                            <input type="text" id="searchInp" autocomplete="off" placeholder="Enter Chest No (e.g. J101 or 101)..." value="${state.searchQuery}" oninput="window.updateSearch(this.value)" class="w-full bg-slate-900 border-2 border-slate-700 rounded-2xl pl-5 pr-12 py-4 text-white outline-none focus:border-sky-500 num-font text-xl shadow-inner transition-colors uppercase">
                            <div class="absolute right-5 top-1/2 transform -translate-y-1/2 text-slate-500 text-xl pointer-events-none">🔍</div>
                        </div>
                    </div>
                `;
                
                const q = state.searchQuery.trim().toLowerCase();
                // Smart Search: matches exact Chest No (e.g. "j101") or numeric shorthand ("101")
                const c = state.candidates.find(x => {
                    const reg = String(x.regNo).trim().toLowerCase();
                    return reg === q || reg === 'j' + q || reg === 's' + q;
                });
                
                if(c) {
                    const tPts = candTotalPts[c.id] || 0;
                    html += `
                    <div class="fade-in bg-gradient-to-br from-indigo-900/80 to-slate-900/80 border border-sky-500/40 p-6 rounded-[2rem] shadow-2xl mb-6 text-center relative overflow-hidden backdrop-blur-sm">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/10 rounded-full blur-3xl"></div>
                        <div class="text-xs font-black text-sky-400 uppercase tracking-widest mb-1 font-mono">Chest No. ${c.regNo}</div>
                        <h3 class="text-2xl sm:text-3xl font-black text-white mb-2 leading-tight">${c.name}</h3>
                        <div class="inline-block bg-black/40 px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 border border-white/10 mb-6 uppercase tracking-wider">${c.team} • ${c.cat}</div>
                        <div class="text-6xl font-black text-emerald-400 num-font mb-2 drop-shadow-[0_0_15px_rgba(52,211,153,0.3)]">${tPts}</div>
                        <p class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest bg-emerald-900/30 inline-block px-3 py-1 rounded-full border border-emerald-800/50">Total Points Earned</p>
                    </div>
                    
                    <h4 class="fade-in text-white font-black text-lg mb-3 tracking-tight">Your Events & Certificates</h4>
                    <div class="space-y-4 fade-in pb-4">`;
                    
                    if(c.assignedPrograms && c.assignedPrograms.length > 0) {
                        c.assignedPrograms.forEach(pid => {
                            const p = state.programs.find(x => x.id === pid); if(!p) return;
                            const r = state.results.find(x => x.progId === pid);
                            
                            let badge = '<span class="text-[10px] text-slate-400 font-bold bg-slate-900 px-2 py-1.5 rounded-md border border-slate-800 uppercase tracking-wider shrink-0 shadow-inner">⏳ Pending</span>';
                            let downloadBtn = '';
                            let positionStr = '';
                            let pArr = (p.pointScheme || (p.format === 'Group' ? "15,8,5" : "10,5,3")).split(',').map(Number);

                            if (r) {
                                if ((Array.isArray(r.first)?r.first:[]).includes(c.id)) {
                                    badge = `<span class="text-[10px] text-yellow-900 bg-yellow-400 px-2 py-1.5 rounded-md font-bold uppercase tracking-wider shrink-0 shadow-md">🥇 1st Place (+${pArr[0]})</span>`;
                                    positionStr = 'First Place';
                                }
                                else if ((Array.isArray(r.second)?r.second:[]).includes(c.id)) {
                                    badge = `<span class="text-[10px] text-slate-900 bg-slate-300 px-2 py-1.5 rounded-md font-bold uppercase tracking-wider shrink-0 shadow-md">🥈 2nd Place (+${pArr[1]})</span>`;
                                    positionStr = 'Second Place';
                                }
                                else if ((Array.isArray(r.third)?r.third:[]).includes(c.id)) {
                                    badge = `<span class="text-[10px] text-amber-900 bg-amber-500 px-2 py-1.5 rounded-md font-bold uppercase tracking-wider shrink-0 shadow-md">🥉 3rd Place (+${pArr[2]})</span>`;
                                    positionStr = 'Third Place';
                                }
                                else {
                                    badge = '<span class="text-[10px] text-slate-400 font-bold bg-slate-800/80 px-2 py-1.5 rounded-md shrink-0 uppercase tracking-wider">✔️ Participated</span>';
                                }

                                if(positionStr !== '') {
                                    const safeProgName = p.name.replace(/'/g, "\\'");
                                    const safeCandName = c.name.replace(/'/g, "\\'");
                                    const safeTeam = c.team.replace(/'/g, "\\'");
                                    const safeCat = c.cat.replace(/'/g, "\\'");
                                    
                                    downloadBtn = `
                                    <button onclick="window.downloadCertificate('${safeCandName}', '${safeTeam}', '${safeCat}', '${safeProgName}', '${positionStr}')" class="mt-3 w-full bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white text-xs font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform border border-sky-400/30">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Download Digital Certificate
                                    </button>`;
                                }
                            }
                            
                            html += `
                            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/80 shadow-md">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="text-sm font-bold text-white leading-tight">${p.progNo ? `<span class="text-sky-400 font-mono text-xs block mb-0.5">#${p.progNo}</span>` : ''}${p.name}</div>
                                    ${badge}
                                </div>
                                ${downloadBtn}
                            </div>`;
                        });
                    } else { 
                        html += `<div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-800 text-center text-xs text-slate-400">No events assigned yet.</div>`; 
                    }
                    html += `</div>`;
                } else if (state.searchQuery.length > 0) {
                    html += `<div class="fade-in text-center p-8 bg-slate-900/50 rounded-[2rem] border border-slate-800 text-slate-400 text-sm shadow-inner mt-4">
                        <div class="text-4xl mb-2">🕵️‍♂️</div>
                        No candidate found for <br><strong class="text-white text-lg mt-1 inline-block">"${state.searchQuery}"</strong>
                    </div>`;
                } else {
                    html += `<div class="fade-in text-center p-8 text-slate-500 text-xs mt-10">Type your Chest No above (e.g., J101 or 101) to instantly see your enrolled programs, points, and unlock your printable certificates!</div>`;
                }
                content.innerHTML = html;
            }

            if (state.tab === 'gallery') {
                content.innerHTML = `
                    <div class="fade-in pb-6">
                        <div class="mb-6 text-center">
                            <h2 class="text-white font-black text-2xl tracking-tight mb-2">Fest Gallery</h2>
                            <p class="text-slate-400 text-xs">Highlights & Art from Aawaaze Funoon S4</p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261011_193849.png" class="rounded-2xl w-full h-32 sm:h-40 object-cover border border-slate-700/50 shadow-md bg-white">
                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%205-01.png" class="rounded-2xl w-full h-32 sm:h-40 object-cover border border-slate-700/50 shadow-md bg-black">
                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%204-01.png" class="rounded-2xl w-full h-32 sm:h-40 object-cover border border-slate-700/50 shadow-md bg-black">
                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261008_191200.png" class="rounded-2xl w-full h-32 sm:h-40 object-cover border border-slate-700/50 shadow-md bg-black">
                        </div>

                        <a href="https://t.me" target="_blank" class="w-full bg-[#0088cc] hover:bg-[#0077b3] text-white font-bold py-4 rounded-2xl shadow-[0_10px_20px_rgba(0,136,204,0.3)] flex items-center justify-center gap-3 transition active:scale-95 border border-[#0099e6]">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.84 1.18-5.18 3.44-.49.33-.93.5-1.33.49-.44-.01-1.28-.24-1.9-.44-.77-.24-1.38-.37-1.33-.78.03-.21.32-.43.88-.67 3.45-1.5 5.75-2.5 6.9-2.98 3.28-1.38 3.96-1.62 4.41-1.63.1 0 .32.02.44.11.1.08.13.19.14.28.01.07.01.14 0 .2z"/></svg>
                            Join Official Telegram Channel
                        </a>
                    </div>
                `;
            }
        };
    </script>
</body>
