<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Portal - Urava S4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #020617; color: #f8fafc; touch-action: pan-y; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .ag-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(18px); border: 1px solid rgba(56, 189, 248, 0.16); box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.65); }
        .ag-float { animation: agFloat 6s ease-in-out infinite; }
        @keyframes agFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
        .fade-in { animation: fadeIn 0.28s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fit-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
        .fit-table th, .fit-table td { word-wrap: break-word; overflow-wrap: break-word; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen pb-32 md:pb-12 relative">

    <header class="bg-slate-900/85 backdrop-blur-xl border-b border-slate-800/80 px-4 py-3 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261008_191200.png" class="h-10 w-10 rounded-xl border border-slate-700/60 object-cover">
                <div>
                    <h1 class="text-base sm:text-lg font-black text-white tracking-tight leading-none mb-0.5" style="font-family:'Cinzel', serif;">AAWAAZE FUNOON S04</h1>
                    <p class="text-[9px] text-sky-400 font-bold uppercase tracking-widest leading-none">Live Results & Poster Studio</p>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800">
                <button onclick="window.switchTab('home')" id="dnav-home" class="px-4 py-2 rounded-xl text-xs font-bold transition">📊 Home</button>
                <button onclick="window.switchTab('results')" id="dnav-results" class="px-4 py-2 rounded-xl text-xs font-bold transition">🏆 Results & Posters</button>
                <button onclick="window.switchTab('search')" id="dnav-search" class="px-4 py-2 rounded-xl text-xs font-bold transition">🔍 Profile</button>
                <button onclick="window.switchTab('trolls')" id="dnav-trolls" class="px-4 py-2 rounded-xl text-xs font-bold transition">🎭 Trolls</button>
                <button onclick="window.switchTab('gallery')" id="dnav-gallery" class="px-4 py-2 rounded-xl text-xs font-bold transition">🖼️ Gallery</button>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="window.openChampionPopup(true)" class="px-2.5 py-1 bg-amber-500/20 border border-amber-500/40 rounded-full text-[10px] font-black text-amber-300 uppercase">👑 Champions</button>
            </div>
        </div>
    </header>

    <div id="liveToast" class="fixed top-20 right-4 left-4 sm:left-auto sm:w-80 bg-slate-900/95 border border-sky-500/50 text-white p-3.5 rounded-2xl shadow-2xl z-[500] hidden flex-col gap-0.5 backdrop-blur-xl" onclick="this.style.display='none'">
        <span id="toastHeader" class="text-[10px] font-black uppercase tracking-widest text-sky-400">✨ Notification</span>
        <span id="toastMsg" class="font-bold text-xs text-slate-100"></span>
    </div>

    <main id="appContent" class="max-w-7xl mx-auto p-3 sm:p-6 relative z-10"></main>

    <nav class="md:hidden fixed bottom-3 left-3 right-3 bg-slate-900/95 backdrop-blur-2xl border border-slate-700/80 p-1.5 rounded-2xl flex justify-around items-center z-40 shadow-2xl">
        <button onclick="window.switchTab('home')" id="nav-home" class="flex flex-col items-center py-1.5 px-2.5 rounded-xl"><span class="text-lg mb-0.5">📊</span><span class="text-[9px] font-extrabold uppercase">Home</span></button>
        <button onclick="window.switchTab('results')" id="nav-results" class="flex flex-col items-center py-1.5 px-2.5 rounded-xl"><span class="text-lg mb-0.5">🏆</span><span class="text-[9px] font-extrabold uppercase">Results</span></button>
        <button onclick="window.switchTab('search')" id="nav-search" class="flex flex-col items-center py-1.5 px-2.5 rounded-xl"><span class="text-lg mb-0.5">🔍</span><span class="text-[9px] font-extrabold uppercase">Profile</span></button>
        <button onclick="window.switchTab('trolls')" id="nav-trolls" class="flex flex-col items-center py-1.5 px-2.5 rounded-xl"><span class="text-lg mb-0.5">🎭</span><span class="text-[9px] font-extrabold uppercase">Trolls</span></button>
        <button onclick="window.switchTab('gallery')" id="nav-gallery" class="flex flex-col items-center py-1.5 px-2.5 rounded-xl"><span class="text-lg mb-0.5">🖼️</span><span class="text-[9px] font-extrabold uppercase">Gallery</span></button>
    </nav>

    <!-- Modals (Champion, QR Scanner, Cropper, Winner Poster, Result Poster) -->
    <div id="championPopupModal" style="display:none;" class="fixed inset-0 bg-black/90 z-[480] items-center justify-center p-4 backdrop-blur-lg overflow-y-auto">
        <div class="ag-card max-w-lg w-full rounded-[2rem] p-6 border-2 border-amber-400/60 text-center relative my-auto">
            <button onclick="window.closeChampionPopup()" class="absolute top-4 right-4 px-3 py-1 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">✕</button>
            <div class="text-5xl mb-2 animate-bounce">🏆</div>
            <span class="text-[10px] font-black uppercase text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">Grand Finale Result</span>
            <h2 id="champPopupHeading" class="text-xl sm:text-2xl font-black text-white mt-3" style="font-family:'Cinzel', serif;">OVERALL CHAMPIONS</h2>
            <div id="champWinnerBox" class="bg-gradient-to-br from-amber-500/20 via-yellow-500/10 to-slate-950 border-2 border-amber-400 rounded-3xl p-5 my-4"></div>
            <div id="champRunnerBox" class="bg-slate-900 border border-slate-700 rounded-2xl p-3.5 mb-4"></div>
            <div class="flex gap-2 justify-center">
                <button onclick="window.playFanfareSound(); window.firePortalConfetti();" class="flex-1 bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">🎺 Fanfare</button>
                <button onclick="window.closeChampionPopup(); window.switchTab('trolls');" class="flex-1 bg-pink-600 text-white font-black py-3 rounded-xl text-xs uppercase">🎭 Trolls</button>
            </div>
        </div>
    </div>

    <div id="qrScannerModal" style="display:none;" class="fixed inset-0 bg-black/90 z-[350] items-center justify-center p-4 backdrop-blur-md">
        <div class="ag-card max-w-sm w-full rounded-3xl p-5 border border-sky-500/40 text-center">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <h3 class="text-sm font-black text-sky-400 uppercase">📷 Scan ID QR</h3>
                <button onclick="window.closeQrScanner()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold">✕</button>
            </div>
            <div id="qrReaderBox" class="w-full rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 min-h-[240px]"></div>
        </div>
    </div>

    <div id="cropModal" style="display:none;" class="fixed inset-0 bg-black/95 z-[450] items-center justify-center p-4 backdrop-blur-md">
        <div class="ag-card max-w-md w-full rounded-3xl p-4 border border-sky-500/40 flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <h3 class="text-sm font-black text-sky-400 uppercase">✂️ Crop Photo</h3>
                <button onclick="window.closeCropModal()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold">✕</button>
            </div>
            <div class="w-full h-72 bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
                <img id="cropImageTarget" src="" class="max-w-full max-h-full block">
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="window.closeCropModal()" class="flex-1 py-2.5 bg-slate-800 text-slate-200 rounded-xl text-xs font-bold">Cancel</button>
                <button onclick="window.applyCropPhoto()" class="flex-1 py-2.5 bg-sky-600 text-white rounded-xl text-xs font-black">✔️ Apply</button>
            </div>
        </div>
    </div>

    <div id="posterStudioModal" style="display:none;" class="fixed inset-0 bg-black/92 z-[300] items-center justify-center p-2 sm:p-4 backdrop-blur-md overflow-y-auto">
        <div class="ag-card max-w-4xl w-full rounded-3xl p-4 sm:p-6 border border-sky-500/30 my-auto max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                <h3 class="text-base sm:text-lg font-black text-white">📸 Winner Photo Poster Studio</h3>
                <button onclick="window.closePosterStudio()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">✕ Close</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                <div class="lg:col-span-6 flex flex-col items-center bg-slate-950 p-3 rounded-2xl border border-slate-800">
                    <canvas id="posterCanvas" class="w-full max-w-[360px] h-auto rounded-xl shadow-2xl border border-slate-800"></canvas>
                    <button onclick="window.downloadWinnerPoster()" class="mt-3 w-full max-w-[360px] bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl text-xs uppercase">⬇️ Download Poster (PNG)</button>
                </div>
                <div class="lg:col-span-6 space-y-3.5 text-xs">
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-pink-500/30">
                        <label class="block text-[10px] font-black text-pink-400 uppercase mb-2">🎨 Choose Poster Background Model</label>
                        <div class="grid grid-cols-3 gap-2 mb-2" id="winnerModelBtns"></div>
                        <input type="file" id="customWinnerBgInput" accept="image/*" class="hidden" onchange="window.handleCustomBgUpload(event, 'winner')">
                        <button type="button" onclick="document.getElementById('customWinnerBgInput').click()" class="w-full py-1.5 bg-slate-800 text-slate-300 rounded-lg text-[10px] font-bold">📁 Upload Custom Background</button>
                    </div>
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800">
                        <label class="block text-[10px] font-black text-sky-400 uppercase mb-2">1. Candidate Photo & Frame</label>
                        <input type="file" id="posterPhotoInput" accept="image/*" class="hidden" onchange="window.handlePosterPhotoSelect(event)">
                        <div class="flex gap-2 mb-2.5">
                            <button type="button" onclick="document.getElementById('posterPhotoInput').click()" class="flex-1 bg-sky-600 text-white font-bold py-2 rounded-xl text-xs">📷 Select Photo</button>
                            <button type="button" onclick="window.reopenCropModal()" id="reCropBtn" class="px-3 py-2 bg-slate-800 text-sky-300 font-bold rounded-xl text-xs hidden">✂️ Crop</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" onclick="window.setPosterShape('circle')" id="shapeBtn-circle" class="py-1.5 rounded-lg font-bold text-[10px] uppercase border">Circle</button>
                            <button type="button" onclick="window.setPosterShape('rounded')" id="shapeBtn-rounded" class="py-1.5 rounded-lg font-bold text-[10px] uppercase border">Rounded</button>
                            <button type="button" onclick="window.setPosterShape('none')" id="shapeBtn-none" class="py-1.5 rounded-lg font-bold text-[10px] uppercase border">Square</button>
                        </div>
                    </div>
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                        <label class="block text-[10px] font-black text-emerald-400 uppercase">2. Poster Text Details</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="pStudioName" oninput="window.renderWinnerPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold text-xs">
                            <input type="text" id="pStudioPlace" oninput="window.renderWinnerPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-amber-400 font-bold text-xs">
                            <input type="text" id="pStudioCatTeam" oninput="window.renderWinnerPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sky-300 font-bold text-xs">
                            <input type="text" id="pStudioProg" oninput="window.renderWinnerPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-emerald-300 font-bold text-xs">
                        </div>
                    </div>
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                        <span class="text-[10px] font-black text-amber-400 uppercase">3. Adjust Position & Size</span>
                        <div class="grid grid-cols-2 gap-3">
                            <div><span class="text-[9px] text-slate-400">Photo X</span><input type="range" id="slPhotoX" min="10" max="90" value="49" oninput="window.renderWinnerPosterCanvas()" class="w-full"></div>
                            <div><span class="text-[9px] text-slate-400">Photo Y</span><input type="range" id="slPhotoY" min="10" max="90" value="48" oninput="window.renderWinnerPosterCanvas()" class="w-full"></div>
                            <div><span class="text-[9px] text-slate-400">Photo Size</span><input type="range" id="slPhotoSize" min="10" max="45" value="21" oninput="window.renderWinnerPosterCanvas()" class="w-full"></div>
                            <div><span class="text-[9px] text-slate-400">Text Y</span><input type="range" id="slTextY" min="25" max="92" value="68" oninput="window.renderWinnerPosterCanvas()" class="w-full"></div>
                            <div class="col-span-2"><span class="text-[9px] text-slate-400">Candidate Name Size</span><input type="range" id="slNameSize" min="26" max="64" value="40" oninput="window.renderWinnerPosterCanvas()" class="w-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultPosterModal" style="display:none;" class="fixed inset-0 bg-black/92 z-[320] items-center justify-center p-2 sm:p-4 backdrop-blur-md overflow-y-auto">
        <div class="ag-card max-w-4xl w-full rounded-3xl p-4 sm:p-6 border border-amber-500/40 my-auto max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                <h3 class="text-base sm:text-lg font-black text-amber-400">🏆 1st • 2nd • 3rd Result Poster Studio</h3>
                <button onclick="window.closeResultPosterStudio()" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">✕ Close</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                <div class="lg:col-span-6 flex flex-col items-center bg-slate-950 p-3 rounded-2xl border border-slate-800">
                    <canvas id="resultPosterCanvas" class="w-full max-w-[360px] h-auto rounded-xl shadow-2xl border border-slate-800"></canvas>
                    <button onclick="window.downloadResultPoster()" class="mt-3 w-full max-w-[360px] bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">⬇️ Download Result Poster (PNG)</button>
                </div>
                <div class="lg:col-span-6 space-y-3.5 text-xs">
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-amber-500/30">
                        <label class="block text-[10px] font-black text-amber-400 uppercase mb-2">🎨 Choose Result Background Model</label>
                        <div class="grid grid-cols-3 gap-2 mb-2" id="resultModelBtns"></div>
                        <input type="file" id="customResultBgInput" accept="image/*" class="hidden" onchange="window.handleCustomBgUpload(event, 'result')">
                        <button type="button" onclick="document.getElementById('customResultBgInput').click()" class="w-full py-1.5 bg-slate-800 text-slate-300 rounded-lg text-[10px] font-bold">📁 Upload Custom Background</button>
                    </div>
                    <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                        <label class="block text-[10px] font-black text-sky-400 uppercase">✏️ Edit Program & Winners</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="resStudioProg" oninput="window.renderResultPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold text-xs">
                            <input type="text" id="resStudioCat" oninput="window.renderResultPosterCanvas()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sky-300 font-bold text-xs">
                        </div>
                        <div><input type="text" id="resStudio1st" oninput="window.renderResultPosterCanvas()" placeholder="1st Place" class="w-full bg-slate-950 border border-yellow-500/40 rounded-lg px-2.5 py-1.5 text-white font-bold text-xs"></div>
                        <div><input type="text" id="resStudio2nd" oninput="window.renderResultPosterCanvas()" placeholder="2nd Place" class="w-full bg-slate-950 border border-slate-500/40 rounded-lg px-2.5 py-1.5 text-white font-bold text-xs"></div>
                        <div><input type="text" id="resStudio3rd" oninput="window.renderResultPosterCanvas()" placeholder="3rd Place" class="w-full bg-slate-950 border border-amber-600/40 rounded-lg px-2.5 py-1.5 text-white font-bold text-xs"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const primaryConfig = {
            apiKey: "AIzaSyDy4XPx_UwsoLzh3PTCgfsccZxz5Oc80n8",
            authDomain: "fest-66fe3.firebaseapp.com",
            projectId: "fest-66fe3",
            storageBucket: "fest-66fe3.firebasestorage.app",
            messagingSenderId: "1044450457376",
            appId: "1:1044450457376:web:94c5aa76b0bf7a2fc20945"
        };
        const legacyConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8"
        };

        const primaryApp = initializeApp(primaryConfig, "primaryPortal");
        const primaryAuth = getAuth(primaryApp);
        const primaryDb = getFirestore(primaryApp);

        const legacyApp = initializeApp(legacyConfig, "legacyPortal");
        const legacyAuth = getAuth(legacyApp);
        const legacyDb = getFirestore(legacyApp);

        const festId = 'urava-s4-fest';
        const DEFAULT_POSTER_URL = "https://raw.githubusercontent.com/BUSA2023/Festviewmob/refs/heads/main/Untitled-1-Recovered-Recovered.png";

        const DEFAULT_FINALE_CONFIG = {
            festEnded: true,
            championTitle: "OVERALL CHAMPIONS - URAVA S04",
            championSubtitle: "Congratulations to the victorious team of Aawaaze Funoon Season 04!",
            cancelledNotice: "Official Notice: Program cancelled by the Fest Committee.",
            trolls: [
                { id: 't1', target: 'Runner-Up Team', text: 'അടുത്ത സീസണിൽ നോക്കാം മക്കളേ... കപ്പ് ഞങ്ങൾക്കിരിക്കട്ടെ! 🏆😂', voiceText: 'അടുത്ത സീസണിൽ നോക്കാം മക്കളേ, കപ്പ് ഞങ്ങൾക്കിരിക്കട്ടെ!', soundType: 'laugh', audioUrl: '' },
                { id: 't2', target: 'Point Table Lookers', text: 'പോയിന്റ് ടേബിൾ നോക്കി കണ്ണ് തള്ളിയോ? ഇതൊക്കെയെന്ത്! 🔥😎', voiceText: 'പോയിന്റ് ടേബിൾ നോക്കി കണ്ണ് തള്ളിയോ? ഇതൊക്കെയെന്ത്!', soundType: 'horn', audioUrl: '' }
            ]
        };

        let state = {
            programs: [], candidates: [], results: [],
            posterTemplates: { winnerModel1: DEFAULT_POSTER_URL, resultModel1: DEFAULT_POSTER_URL, activeWinnerModel: 1, activeResultModel: 1 },
            finaleConfig: { ...DEFAULT_FINALE_CONFIG },
            tab: 'home', tableCatFilter: 'All', resCatFilter: 'All', searchQuery: '',
            hasShownChampionPopup: false
        };
        window.state = state;

        const urlParams = new URLSearchParams(window.location.search);
        const qrCandParam = urlParams.get('c');
        if (qrCandParam) { state.tab = 'search'; state.searchQuery = qrCandParam.trim(); }

        window.showAppToast = (header, msg, icon = "✨") => {
            const toast = document.getElementById('liveToast');
            document.getElementById('toastHeader').innerHTML = `${icon} ${header}`;
            document.getElementById('toastMsg').innerText = msg;
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        };

        window.switchTab = (tab) => { state.tab = tab; window.renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        window.updateSearch = (val) => { state.searchQuery = val; window.renderApp(); };

        let primaryData = { programs: [], candidates: [], results: [], templates: null, finale: null };
        let legacyData = { programs: [], candidates: [], results: [], templates: null, finale: null };

        const recomputeMergedState = () => {

            if (!rawSelectedPhotoUrl) return;
            const imgEl = document.getElementById('cropImageTarget'); imgEl.src = rawSelectedPhotoUrl;
            document.getElementById('cropModal').style.display = 'flex';
            if (cropperInstance) cropperInstance.destroy();
            setTimeout(() => { cropperInstance = new Cropper(imgEl, { aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.9 }); }, 60);
        };

        window.closeCropModal = () => { if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; } document.getElementById('cropModal').style.display = 'none'; };
        window.applyCropPhoto = () => {
            if (!cropperInstance) return;
            const croppedCanvas = cropperInstance.getCroppedCanvas({ width: 700, height: 700 });
            const croppedImg = new Image();
            croppedImg.onload = () => { winnerCandPhoto = croppedImg; document.getElementById('reCropBtn').classList.remove('hidden'); window.closeCropModal(); window.renderWinnerPosterCanvas(); };
            croppedImg.src = croppedCanvas.toDataURL('image/png');
        };

        window.renderWinnerPosterCanvas = () => {
            const canvas = document.getElementById('posterCanvas'); if (!canvas) return;
            const ctx = canvas.getContext('2d'); const W = winnerBgImage.naturalWidth || 1080; const H = winnerBgImage.naturalHeight || 1350;
            canvas.width = W; canvas.height = H;
            if (winnerBgImage && winnerBgImage.complete && winnerBgImage.naturalWidth > 0) ctx.drawImage(winnerBgImage, 0, 0, W, H);
            else { ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, W, H); }

            const pX = (49 / 100) * W; const pY = (48 / 100) * H; const radius = (21 / 100) * W; const tY = (68 / 100) * H;
            if (winnerCandPhoto) {
                ctx.save(); ctx.beginPath();
                if (posterShape === 'circle') ctx.arc(pX, pY, radius, 0, Math.PI * 2);
                else if (posterShape === 'rounded') ctx.roundRect(pX - radius, pY - radius, radius * 2, radius * 2, radius * 0.22);
                else ctx.rect(pX - radius, pY - radius, radius * 2, radius * 2);
                ctx.clip(); ctx.drawImage(winnerCandPhoto, pX - radius, pY - radius, radius * 2, radius * 2); ctx.restore();
            }

            const nameTxt = (document.getElementById('pStudioName')?.value || '').toUpperCase();
            const placeTxt = (document.getElementById('pStudioPlace')?.value || '').toUpperCase();
            const catTeamTxt = (document.getElementById('pStudioCatTeam')?.value || '').toUpperCase();
            const progTxt = (document.getElementById('pStudioProg')?.value || '').toUpperCase();

            ctx.textAlign = 'center'; const s = W / 1080;
            ctx.fillStyle = '#0284c7'; ctx.font = `900 ${Math.round(28 * s)}px "Outfit", sans-serif`; ctx.fillText(`🏆 ${placeTxt}`, W / 2, tY);
            ctx.fillStyle = '#0f172a'; ctx.font = `900 ${Math.round(40 * s)}px "Outfit", sans-serif`; ctx.fillText(nameTxt, W / 2, tY + 48 * s, W * 0.82);
            ctx.fillStyle = '#0369a1'; ctx.font = `800 ${Math.round(25 * s)}px "Outfit", sans-serif`; ctx.fillText(catTeamTxt, W / 2, tY + 86 * s, W * 0.82);
            ctx.fillStyle = '#1e293b'; ctx.font = `800 ${Math.round(30 * s)}px "Outfit", sans-serif`; ctx.fillText(progTxt, W / 2, tY + 126 * s, W * 0.84);
        };

        window.downloadWinnerPoster = () => {
            const canvas = document.getElementById('posterCanvas');
            const a = document.createElement('a'); a.href = canvas.toDataURL('image/png', 1.0); a.download = `WinnerPoster.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            window.showAppToast("Poster Downloaded!", "Saved successfully.", "✅");
        };

        let html5QrScanner = null;
        window.openQrScanner = () => {
            document.getElementById('qrScannerModal').style.display = 'flex';
            if (html5QrScanner) { try { html5QrScanner.clear(); } catch(e) {} }
            html5QrScanner = new Html5Qrcode("qrReaderBox");
            html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 210, height: 210 } }, (txt) => {
                let chestNo = txt.trim();
                try { const u = new URL(txt); if (u.searchParams.get('c')) chestNo = u.searchParams.get('c'); } catch(e) {}
                window.closeQrScanner(); state.tab = 'search'; state.searchQuery = chestNo; window.renderApp();
            }, () => {}).catch(() => {});
        };
        window.closeQrScanner = () => { document.getElementById('qrScannerModal').style.display = 'none'; if (html5QrScanner) html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {}); };

        window.renderApp();
        startListeners();
    </script>
</body>
</html>
