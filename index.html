    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Premium Fonts for UI and Certificates -->
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Anek Malayalam', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .num-font { font-family: 'Outfit', sans-serif; }
        .nav-active { color: #38bdf8; transform: translateY(-2px); }
        .nav-inactive { color: #64748b; }
        
        /* Anti-Gravity Floating UI Setup */
        .ag-float {
            animation: antiGravityFloat 6s ease-in-out infinite;
        }
        .ag-float-delayed {
            animation: antiGravityFloat 7s ease-in-out 1.5s infinite;
        }
        .ag-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.96));
            border: 1px solid rgba(56, 189, 248, 0.18);
            box-shadow: 0 18px 40px -15px rgba(0, 0, 0, 0.7), 0 0 25px -5px rgba(56, 189, 248, 0.08);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        @keyframes antiGravityFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        
        /* Animations */
        .toast-slide { animation: slideDown 0.4s ease forwards; }
        .fade-in { animation: fadeIn 0.25s ease forwards; }
        @keyframes slideDown { from { transform: translateY(-150%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Fit-to-screen responsive table cells for any device without nested scroll traps */
        .fit-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .fit-table th, .fit-table td {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="bg-slate-950 pb-36 md:pb-16 relative min-h-screen selection:bg-sky-500 selection:text-slate-950">

    <!-- Preload fonts for Canvas so they don't pop-in late -->
    <div style="visibility: hidden; position: absolute; width: 0; height: 0; overflow: hidden;">
        <span style="font-family: 'Cinzel';">preload</span>
        <span style="font-family: 'Playfair Display';">preload</span>
        <span style="font-family: 'Great Vibes';">preload</span>
    </div>

    <!-- Ambient Anti-Gravity Background Orbs & Watermark -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-24 -left-24 w-72 h-72 bg-sky-500/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="inset-0 opacity-[0.03] flex items-center justify-center w-full h-full">
            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%204-01.png" class="w-4/5 max-w-3xl h-auto object-contain">
        </div>
    </div>

    <!-- Header (Auto-Adaptive for Phone, Tablet & PC) -->
    <header class="bg-slate-900/85 backdrop-blur-2xl border-b border-slate-800/80 sticky top-0 z-40 shadow-xl w-full">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3.5 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
                <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261008_191200.png" class="h-9 w-9 sm:h-11 sm:w-11 rounded-xl shadow-md border border-slate-700/50 object-cover shrink-0">
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-lg lg:text-xl font-black text-white tracking-tight leading-none mb-0.5 truncate" style="font-family: 'Cinzel', serif;">AAWAAZE FUNOON S04</h1>
                    <div class="flex items-center gap-1.5">
                        <p class="text-[8px] sm:text-[10px] text-sky-400 font-bold uppercase tracking-widest leading-none truncate">Live Results Portal</p>
                        <span id="deviceBadge" class="text-[8px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-bold uppercase border border-slate-700 hidden sm:inline-block">Auto-Fit</span>
                    </div>
                </div>
            </div>

            <!-- Desktop / Tablet Top Navigation -->
            <nav class="hidden md:flex items-center gap-1 bg-slate-950/90 p-1.5 rounded-2xl border border-slate-800/90 shadow-inner shrink-0">
                <button onclick="switchTab('home')" id="dnav-home" class="px-3.5 lg:px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5">
                    <span>📊</span><span>Dashboard</span>
                </button>
                <button onclick="switchTab('results')" id="dnav-results" class="px-3.5 lg:px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5">
                    <span>🏆</span><span>Results</span>
                </button>
                <button onclick="switchTab('search')" id="dnav-search" class="px-3.5 lg:px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5">
                    <span>🔍</span><span>Profile & Certs</span>
                </button>
                <button onclick="switchTab('gallery')" id="dnav-gallery" class="px-3.5 lg:px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5">
                    <span>🖼️</span><span>Gallery</span>
                </button>
            </nav>

            <div class="flex items-center gap-1.5 px-2.5 py-1 bg-red-500/10 border border-red-500/20 rounded-full shrink-0">
                <span id="liveDot" class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span>
                <span id="liveStatusText" class="text-[9px] sm:text-[10px] text-red-400 font-bold uppercase tracking-widest">Live</span>
            </div>
        </div>
    </header>

    <!-- Database / Network Warning Banner for Other Phones -->
    <div id="dbErrorBanner" class="hidden max-w-7xl mx-auto mt-3 px-3 sm:px-6 lg:px-8 relative z-30">
        <div class="bg-amber-950/90 border border-amber-500/50 rounded-2xl p-3.5 text-amber-200 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 shadow-lg">
            <div>
                <strong class="text-amber-400 block sm:inline">⚠️ Connection Notice:</strong>
                <span id="dbErrorMsg">Connecting to fallback database...</span>
            </div>
            <button onclick="window.location.reload()" class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-wider shrink-0 self-start sm:self-auto">Retry</button>
        </div>
    </div>

    <!-- Custom Toast Notification System -->
    <div id="liveToast" class="fixed top-16 sm:top-20 left-3 right-3 sm:left-auto sm:right-6 sm:w-96 bg-gradient-to-r from-sky-600 to-indigo-600 text-white p-3.5 sm:p-4 rounded-2xl shadow-2xl z-[100] hidden border border-sky-400/50 flex-col gap-1 cursor-pointer transition-all" onclick="this.style.display='none'">
        <span id="toastHeader" class="text-[10px] font-black uppercase tracking-widest text-sky-200 flex items-center gap-1"><span>✨</span> Notification</span>
        <span id="toastMsg" class="font-bold text-xs sm:text-sm leading-tight">Message goes here</span>
    </div>

    <!-- Main Content (100% Fluid & Vertically Scrollable Container for Phone, Tablet & PC) -->
    <main class="p-2.5 sm:p-5 lg:p-8 pb-24 relative z-10 max-w-7xl w-full mx-auto" id="appContent">
        <div class="flex justify-center items-center h-40 text-slate-500 text-sm">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-sky-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Syncing Live Data...
        </div>
    </main>

    <!-- Anti-Gravity Floating Bottom Navigation Dock for Mobile & Small Screens -->
    <div class="md:hidden fixed bottom-3 left-3 right-3 z-50 pointer-events-none" style="padding-bottom: var(--safe-bottom);">
        <nav class="pointer-events-auto bg-slate-900/90 backdrop-blur-2xl border border-slate-700/80 rounded-2xl p-1.5 flex justify-around items-center shadow-[0_15px_35px_rgba(0,0,0,0.85)]">
            <button onclick="switchTab('home')" class="flex flex-col items-center py-1.5 px-2 rounded-xl flex-1 transition-all active:scale-95" id="nav-home">
                <span class="text-xl leading-none mb-1 drop-shadow">📊</span><span class="text-[9px] font-extrabold uppercase tracking-wider">Points</span>
            </button>
            <button onclick="switchTab('results')" class="flex flex-col items-center py-1.5 px-2 rounded-xl flex-1 transition-all active:scale-95" id="nav-results">
                <span class="text-xl leading-none mb-1 drop-shadow">🏆</span><span class="text-[9px] font-extrabold uppercase tracking-wider">Results</span>
            </button>
            <button onclick="switchTab('search')" class="flex flex-col items-center py-1.5 px-2 rounded-xl flex-1 transition-all active:scale-95" id="nav-search">
                <span class="text-xl leading-none mb-1 drop-shadow">🔍</span><span class="text-[9px] font-extrabold uppercase tracking-wider">Profile</span>
            </button>
            <button onclick="switchTab('gallery')" class="flex flex-col items-center py-1.5 px-2 rounded-xl flex-1 transition-all active:scale-95" id="nav-gallery">
                <span class="text-xl leading-none mb-1 drop-shadow">🖼️</span><span class="text-[9px] font-extrabold uppercase tracking-wider">Gallery</span>
            </button>
        </nav>
    </div>

    <!-- Hidden Canvas for Certificate Generation -->
    <canvas id="certCanvas" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // PRIMARY DATABASE (fest-66fe3)
        const firebaseConfig = {
            apiKey: "AIzaSyDy4XPx_UwsoLzh3PTCgfsccZxz5Oc80n8",
            authDomain: "fest-66fe3.firebaseapp.com",
            projectId: "fest-66fe3",
            storageBucket: "fest-66fe3.firebasestorage.app",
            messagingSenderId: "1044450457376",
            appId: "1:1044450457376:web:94c5aa76b0bf7a2fc20945",
            measurementId: "G-47FEMSFRCH"
        };

        // FALLBACK LEGACY DATABASE (pullani-6a39b) - Used automatically if new DB blocks other phones
        const legacyFirebaseConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const legacyApp = initializeApp(legacyFirebaseConfig, "legacyPortalApp");
        const legacyAuth = getAuth(legacyApp);
        const legacyDb = getFirestore(legacyApp);

        const festId = 'urava-s4-fest';

        // Read QR Code URL parameter (?c=J101 or ?chest=J101)
        const urlParams = new URLSearchParams(window.location.search);
        const qrCandParam = urlParams.get('c') || urlParams.get('chest') || '';

        const detectDeviceType = () => {
            const w = window.innerWidth;
            if (w < 640) return 'mobile';
            if (w < 1024) return 'tablet';
            return 'desktop';
        };

        let state = { 
            programs: [], 
            candidates: [], 
            results: [], 
            tab: qrCandParam ? 'search' : 'home', 
            searchQuery: qrCandParam,
            pointTableFilter: 'All',
            device: detectDeviceType(),
            usingFallbackDb: false
        };
        let initialLoad = true;
        let listenersAttached = false;
        let fallbackAttached = false;

        const updateDeviceBadge = () => {
            const newDevice = detectDeviceType();
            const badge = document.getElementById('deviceBadge');
            if (badge) {
                const labels = { mobile: '📱 Mobile View', tablet: '📲 Tablet View', desktop: '💻 Desktop View' };
                badge.innerText = labels[newDevice] || 'Auto-Fit';
            }
            if (state.device !== newDevice) {
                state.device = newDevice;
                if (window.renderApp) window.renderApp();
            }
        };

        window.addEventListener('resize', updateDeviceBadge);
        window.addEventListener('orientationchange', () => setTimeout(updateDeviceBadge, 150));
        updateDeviceBadge();

        window.setPointFilter = (f) => {
            state.pointTableFilter = f;
            renderApp();
        };

        window.showAppToast = (header, msg, icon="✨") => {
            const toast = document.getElementById('liveToast');
            document.getElementById('toastHeader').innerHTML = `<span>${icon}</span> ${header}`;
            document.getElementById('toastMsg').innerText = msg;
            toast.style.display = 'flex'; 
            toast.classList.remove('toast-slide');
            void toast.offsetWidth;
            toast.classList.add('toast-slide');
            setTimeout(()=> { toast.style.display = 'none'; }, 5000);
        };

        window.switchTab = (tab) => { state.tab = tab; renderApp(); window.scrollTo(0,0); };
        
        window.updateSearch = (val) => { 
            state.searchQuery = val; 
            renderApp(); 
            const s = document.getElementById('searchInp'); 
            if(s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } 
        };

        // Automatic Fallback to Legacy DB if Primary DB has strict rules or is empty on other phones
        const attachFallbackListeners = (reason) => {
            if (fallbackAttached) return;
            fallbackAttached = true;
            state.usingFallbackDb = true;
            console.warn("Switching to fallback database:", reason);

            signInAnonymously(legacyAuth).catch(() => {});

            onSnapshot(collection(legacyDb, 'artifacts', festId, 'public', 'data', 'settings'), (snap) => {
                if (state.programs.length === 0) {
                    snap.docs.forEach(d => { if(d.id === 'config') state.programs = d.data().programs || []; });
                    renderApp();
                }
            }, () => {});

            onSnapshot(collection(legacyDb, 'artifacts', festId, 'public', 'data', 'candidates'), (snap) => {
                if (state.candidates.length === 0) {
                    state.candidates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApp();
                }
            }, () => {});

            onSnapshot(collection(legacyDb, 'artifacts', festId, 'public', 'data', 'results'), (snap) => {
                if (state.results.length === 0) {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> b.timestamp - a.timestamp);
                    renderApp();
                }
            }, () => {});
        };

        const attachPortalListeners = () => {
            if (listenersAttached) return;
            listenersAttached = true;

            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'settings'), (snap) => {
                let foundProgs = [];
                snap.docs.forEach(d => { if(d.id === 'config') foundProgs = d.data().programs || []; });
                if (foundProgs.length > 0) {
                    state.programs = foundProgs;
                    renderApp();
                } else {
                    attachFallbackListeners("Primary DB has 0 programs");
                }
            }, (err) => {
                console.warn("Primary Settings sync error:", err);
                attachFallbackListeners(err.message);
            });

            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'candidates'), (snap) => {
                if (snap.docs.length > 0) {
                    state.candidates = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
                    renderApp();
                } else {
                    attachFallbackListeners("Primary DB has 0 candidates");
                }
            }, (err) => {
                console.warn("Primary Candidates sync error:", err);
                attachFallbackListeners(err.message);
            });

            onSnapshot(collection(db, 'artifacts', festId, 'public', 'data', 'results'), (snap) => {
                if (snap.docs.length > 0) {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> b.timestamp - a.timestamp); 
                    renderApp();
                }
                
                if(!initialLoad) {
                    snap.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const prog = state.programs.find(p => p.id === change.doc.data().progId);
                            if(prog) window.showAppToast("New Result Published!", prog.name, "🏆");
                        }
                    });
                }
                setTimeout(() => { initialLoad = false; }, 2000);
            }, (err) => {
                console.warn("Primary Results sync error:", err);
                attachFallbackListeners(err.message);
            });
        };

        // 1. Render UI immediately so other phones NEVER get stuck on "Syncing Live Data..."
        setTimeout(() => {
            if (window.renderApp) window.renderApp();
        }, 50);

        // 2. Attach listeners right away AND on auth state change so disabled Anonymous Auth never blocks loading
        attachPortalListeners();

        signInAnonymously(auth).catch((err) => {
            console.warn("Anonymous Auth not enabled on primary project:", err.message);
            attachPortalListeners();
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                attachPortalListeners();
            }
        });

        // Professional Certificate Generator using Canvas
        window.downloadCertificate = (candName, candTeam, candCat, progName, positionStr) => {
            window.showAppToast("Generating Certificate", "Please wait a moment...", "⏳");
            
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set A4 Dimensions (150 DPI)
            canvas.width = 1240; 
            canvas.height = 1754;

            const logo = new Image();
            logo.crossOrigin = "Anonymous";
            logo.src = "https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261011_193849.png";
            
            logo.onload = () => {
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 20;
                ctx.strokeStyle = '#1e3a8a'; 
                ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);
                
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#d4af37'; 
                ctx.strokeRect(80, 80, canvas.width - 160, canvas.height - 160);
                ctx.strokeRect(92, 92, canvas.width - 184, canvas.height - 184);

                ctx.drawImage(logo, canvas.width / 2 - 200, 150, 400, 400);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#1e3a8a';
                ctx.font = '900 55px "Cinzel"';
                ctx.fillText('AAWAAZE FUNOON SEASON 04', canvas.width / 2, 600, canvas.width - 240);

                ctx.fillStyle = '#d4af37'; 
                ctx.font = 'bold 30px "Cinzel"';
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', canvas.width / 2, 680, canvas.width - 240);

                ctx.fillStyle = '#475569';
                ctx.font = 'italic 35px "Playfair Display"';
                ctx.fillText('This certificate is proudly presented to', canvas.width / 2, 820);

                ctx.fillStyle = '#0f172a';
                ctx.font = '900 90px "Outfit"';
                const maxNameWidth = canvas.width - 260;
                ctx.fillText(candName, canvas.width / 2, 950, maxNameWidth);
                
                let nameMetrics = ctx.measureText(candName);
                let underlineWidth = Math.min(nameMetrics.width + 60, maxNameWidth);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 - (underlineWidth / 2), 990);
                ctx.lineTo(canvas.width / 2 + (underlineWidth / 2), 990);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#d4af37';
                ctx.stroke();

                ctx.fillStyle = '#475569';
                ctx.font = '30px "Playfair Display"';
                ctx.fillText(`representing team ${candTeam} (${candCat})`, canvas.width / 2, 1070, canvas.width - 240);
                ctx.fillText('for securing', canvas.width / 2, 1140);

                ctx.fillStyle = '#1e3a8a'; 
                ctx.font = 'bold 55px "Cinzel"';
                ctx.fillText(positionStr.toUpperCase(), canvas.width / 2, 1230, canvas.width - 240);

                ctx.fillStyle = '#475569';
                ctx.font = 'italic 30px "Playfair Display"';
                ctx.fillText('in the event', canvas.width / 2, 1310);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 45px "Cinzel"';
                ctx.fillText(progName, canvas.width / 2, 1390, canvas.width - 240);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 22px "Cinzel"';
                ctx.beginPath(); ctx.moveTo(250, 1600); ctx.lineTo(500, 1600); ctx.stroke();
                ctx.fillText('FEST COORDINATOR', 375, 1640);
                ctx.beginPath(); ctx.moveTo(canvas.width - 500, 1600); ctx.lineTo(canvas.width - 250, 1600); ctx.stroke();
                ctx.fillText('PRINCIPAL', canvas.width - 375, 1640);

                const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `Certificate_${candName}_${progName}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                window.showAppToast('Success!', 'Certificate downloaded to your device.', '✅');
            };

            logo.onerror = () => {
                window.showAppToast('Error', 'Could not load certificate assets.', '❌');
            };
        };

        window.renderApp = () => {
            ['home', 'results', 'search', 'gallery'].forEach(t => {
                const el = document.getElementById('nav-' + t);

                        <div class="space-y-2.5">

                            </div>
                            <div class="bg-gradient-to-r from-amber-700/90 to-amber-600/80 border border-amber-500/50 p-2.5 rounded-xl flex gap-2.5 shadow">
                                <div class="text-xl bg-white/20 h-8 w-8 rounded-lg flex items-center justify-center border border-white/30 shrink-0">🥉</div><div class="flex-1 self-center">${getNameHtml(res.third)}</div>
                            </div>
                        </div>
                    </div>`;
                });
                content.innerHTML = html + `</div>`;
            }

            if (state.tab === 'search') {
                let html = `

                        </div>
                `;
                
                const q = state.searchQuery.trim().toLowerCase();
                const c = state.candidates.find(x => {
                    const reg = String(x.regNo).trim().toLowerCase();

                    const tPts = candTotalPts[c.id] || 0;
                    html += `

                    if(c.assignedPrograms && c.assignedPrograms.length > 0) {
                        c.assignedPrograms.forEach(pid => {

                            let badge = '<span class="text-[9px] text-slate-400 font-bold bg-slate-900 px-2 py-1 rounded border border-slate-800 uppercase shrink-0">⏳ Pending</span>';
                            let downloadBtn = '';
                            let positionStr = '';
                            let pArr = (p.pointScheme || (p.format === 'Group' ? "15,8,5" : "10,5,3")).split(',').map(Number);

                            if (r) {
                                if ((Array.isArray(r.first)?r.first:[]).includes(c.id)) {
                                    badge = `<span class="text-[9px] text-yellow-900 bg-yellow-400 px-2 py-1 rounded font-bold uppercase shrink-0 shadow">🥇 1st (+${pArr[0]})</span>`;
                                    positionStr = 'First Place';

                                    positionStr = 'Second Place';
                                }
                                else if ((Array.isArray(r.third)?r.third:[]).includes(c.id)) {
                                    badge = `<span class="text-[9px] text-amber-900 bg-amber-500 px-2 py-1 rounded font-bold uppercase shrink-0 shadow">🥉 3rd (+${pArr[2]})</span>`;

                                ${downloadBtn}
                            </div>`;
                        });
                    } else { 
                        html += `<div class="col-span-full bg-slate-900/50 p-6 rounded-2xl border border-slate-800 text-center text-xs text-slate-400">No events assigned yet.</div>`;

                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%204-01.png" class="rounded-2xl w-full h-32 sm:h-44 object-cover border border-slate-700/50 shadow bg-black">

                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.84 1.18-5.18 3.44-.49.33-.93.5-1.33.49-.44-.01-1.28-.24-1.9-.44-.77-.24-1.38-.37-1.33-.78.03-.21.32-.43.88-.67 3.45-1.5 5.75-2.5 6.9-2.98 3.28-1.38 3.96-1.62 4.41-1.63.1 0 .32.02.44.11.1.08.13.19.14.28.01.07.01.14 0 .2z"/></svg>
                            Join Official Telegram Channel
                        </a>
                    </div>
                `;
            }
        };
    </script>
